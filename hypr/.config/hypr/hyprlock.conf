# ~/.config/hypr/hyprlock.conf — gestionado desde ~/dotfiles (Stow)
# Estilo completo: reloj grande, fecha, usuario, batería, blur fuerte.

$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.02
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    inner_color = rgba(26, 27, 38, 0.6)
    outer_color = rgba(122, 162, 247, 0.9) rgba(187, 154, 247, 0.9) 45deg
    check_color = rgba(158, 206, 106, 0.9)
    fail_color = rgba(247, 118, 142, 0.9)

    font_color = rgb(192, 202, 245)
    font_family = $font
    fade_on_empty = false
    rounding = 15
    placeholder_text = <span foreground="##a9b1d6">Contraseña...</span>
    fail_text = <span foreground="##f7768e">$FAIL <b>($ATTEMPTS)</b></span>
    dots_spacing = 0.3

    position = 0, -90
    halign = center
    valign = center
}

# Reloj grande
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 110
    font_family = $font
    color = rgb(192, 202, 245)

    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=es_GT.UTF-8 date +'%A, %d de %B' 2>/dev/null || date +'%A, %d %B')"
    font_size = 22
    font_family = $font
    color = rgb(169, 177, 214)

    position = 0, 60
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font
    color = rgb(122, 162, 247)

    position = 0, -20
    halign = center
    valign = center
}

# Batería
label {
    monitor =
    text = cmd[update:15000] echo "  $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '?')%"
    font_size = 16
    font_family = $font
    color = rgb(169, 177, 214)

    position = -30, 30
    halign = right
    valign = bottom
}
