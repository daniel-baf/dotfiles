# ~/.config/hypr/hyprpaper.conf — gestionado desde ~/dotfiles (Stow)
#
# Coloca tu imagen en ~/Pictures/wallpapers/wallpaper.jpg (install.sh crea la
# carpeta pero NO pone ninguna imagen -- sin un archivo real ahí, hyprpaper
# no tiene nada que mostrar y ves pantalla vacía/default).
#
# OJO: las directivas "preload"/"wallpaper" de ESTE archivo no se usan.
# En el paquete de hyprpaper instalado (0.8.4-8) el comando IPC "preload"
# devuelve "invalid hyprpaper request" y las directivas del config se
# procesan antes de que el output esté listo (log: "Monitor eDP-1 has no
# target"), así que el wallpaper nunca se aplica por esta vía. El wallpaper
# se aplica en su lugar desde hyprland.lua vía "hyprctl hyprpaper wallpaper"
# con reintentos justo después de lanzar hyprpaper -- eso sí funciona de
# forma fiable. Ver hyprland.lua (bloque AUTOSTART).
splash = false
ipc = on
