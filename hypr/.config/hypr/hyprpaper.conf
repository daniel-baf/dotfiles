# ~/.config/hypr/hyprpaper.conf — gestionado desde ~/dotfiles (Stow)
#
# Coloca tu imagen en ~/Pictures/wallpapers/wallpaper.jpg (install.sh crea la carpeta
# y, si no hay ninguna imagen, deja un fondo generado como placeholder).

preload = ~/Pictures/wallpapers/wallpaper.jpg
wallpaper = eDP-1,~/Pictures/wallpapers/wallpaper.jpg
splash = false
ipc = on
