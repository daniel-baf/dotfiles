# ~/.config/hypr/hyprpaper.conf — gestionado desde ~/dotfiles (Stow)
#
# Coloca tu imagen en ~/Pictures/wallpapers/wallpaper.jpg (install.sh crea la
# carpeta pero NO pone ninguna imagen -- sin un archivo real ahí, hyprpaper
# no tiene nada que mostrar y ves pantalla vacía/default).
#
# El monitor vacío antes de la coma ("," en vez de "eDP-1,") le dice a
# hyprpaper que aplique el wallpaper a TODAS las pantallas conectadas, no
# solo al panel del Legion -- así ya queda bien si conectás un monitor externo.

preload = ~/Pictures/wallpapers/wallpaper.jpg
wallpaper = ,~/Pictures/wallpapers/wallpaper.jpg
splash = false
ipc = on
