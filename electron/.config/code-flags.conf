# VSCode: lo lee el wrapper /usr/bin/code (visual-studio-code-bin) al lanzar.
# Mismo fix que electron-flags.conf/chrome-flags.conf: la env var
# ELECTRON_OZONE_PLATFORM_HINT=auto de hyprland.lua ya lo pone en Wayland
# nativo, pero el Electron que bundlea VSCode no activa solo el protocolo de
# escala fraccional: sin este flag renderiza a 1x y Hyprland estira el buffer
# 1->1.25 en el eDP -> borroso. Con WaylandFractionalScaleV1 renderiza nítido.
--ozone-platform=wayland
--enable-features=WaylandFractionalScaleV1
