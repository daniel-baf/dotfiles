# Flags para el binario electron del sistema y fallback del wrapper de Cursor
# (/usr/bin/cursor lee electron42-flags.conf y, si no existe, este archivo).
# Mismo fix que chrome-flags.conf: por default estas apps corren bajo XWayland,
# que no soporta el scale 1.25 fraccional de hyprland.lua (renderizan a 1x y
# Hyprland las reescala por software -> borrosas). Con Ozone/Wayland nativo
# respeta el protocolo fractional-scale-v1 y renderiza nítido.
# Nota: VSCode no lee este archivo (su wrapper /usr/bin/code lee
# code-flags.conf); Cursor tampoco en primera instancia (lee
# electron42-flags.conf y este como fallback).
--ozone-platform=wayland
--enable-features=WaylandFractionalScaleV1
