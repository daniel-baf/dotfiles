# ~/.config/kitty/kitty.conf — gestionado desde ~/dotfiles (Stow)

# theme/current.conf es un symlink a theme/{dark,light}.conf, mantenido por
# ~/.config/hypr/scripts/apply-theme.sh. Solo afecta a kittys nuevas
# (kitty no relee este include en caliente sin remote-control configurado).
include theme/current.conf

# -- Fuente --
font_family      CaskaydiaCove Nerd Font
bold_font        CaskaydiaCove Nerd Font Bold
italic_font      CaskaydiaCove Nerd Font Italic
bold_italic_font CaskaydiaCove Nerd Font Bold Italic
font_size        12.0

# -- Transparencia + blur --
# El blur real lo hace Hyprland (decoration.blur en hyprland.lua),
# esto solo define cuánto se ve "a través" de la ventana.
background_opacity 0.88
dynamic_background_opacity yes

# -- Cursor --
cursor_shape beam
cursor_blink_interval 0

# -- Ventana --
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# -- Tabs --
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# -- Scrollback --
scrollback_lines 10000

# -- Misceláneo --
enable_audio_bell no
allow_remote_control yes
