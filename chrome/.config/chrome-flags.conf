# Sin esto Chrome corre bajo XWayland: no soporta escalado fraccional
# (hyprland.lua tiene scale = 1.25), renderiza a 1x y Hyprland lo reescala
# por software -> se ve borroso. Con Ozone/Wayland nativo respeta el
# protocolo fractional-scale-v1 y renderiza nítido.
--ozone-platform=wayland
--enable-features=WaylandFractionalScaleV1
