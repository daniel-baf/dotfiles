# Módulos mainline que hay que dejar fuera en la Legion Pro 5 16ARX8 (82WM),
# porque chocan con legion_laptop (LenovoLegionLinux):
#
# - yogafan: telemetría de ventiladores que en esta máquina reporta 0 RPM
#   falso siempre (fans girando y lee 0). legion_laptop expone lecturas
#   reales del EC vía legion_hwmon, así que este módulo solo mete ruido.
# - lenovo_wmi_gamezone: se registra como provider de platform_profile y su
#   lista de perfiles se interseca con la de legion_laptop, haciendo
#   desaparecer modos (quiet/custom) de /sys/firmware/acpi/platform_profile.
#
# Ver docs/legion/thermal.md para el diagnóstico completo.
blacklist yogafan
blacklist lenovo_wmi_gamezone
