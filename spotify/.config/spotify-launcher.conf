# El cliente oficial de Spotify es CEF (Chromium embebido) y, igual que
# Chrome (ver chrome-flags.conf), arranca en XWayland por default: no
# soporta el scale = 1.25 de hyprland.lua y sale borroso. Forzamos Ozone
# nativo de Wayland.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform,WaylandFractionalScaleV1", "--ozone-platform=wayland"]
