# ~/.config/ranger/rc.conf — gestionado desde ~/dotfiles (Stow)
# Solo overrides -- el resto de la config sale de los defaults de ranger.
# El preview real (markdown, imágenes, PDF, diagramas) vive en scope.sh.

set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set preview_files true
set preview_images true
set preview_images_method kitty

# D: mandar a la papelera (trash-cli, la misma que ve nautilus) en vez de
# borrar permanente -- "dD" sigue borrando de verdad, como siempre.
map D shell trash-put -- %s
